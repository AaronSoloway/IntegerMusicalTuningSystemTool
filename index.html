<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integer Musical Tuning System Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="icon" type="image/png" href="favicon.ico"/>
</head>
<body>
    <header>
        <h1>Integer Musical Tuning System Tool</h1>
    </header>

    <div class="controls-container">
        <div class="controls simple-controls">
            <div class="section-title">Simple Controls</div>
            <div class="playback-controls">
                <div class="control-group">
                    <button id="togglePlay" class="square-button">▶</button>
                </div>
                <div class="control-group volume-control">
                    <label>Volume</label>
                    <input type="range" 
                           id="volumeSlider" 
                           min="-60" 
                           max="10" 
                           value="-20"
                           step="1"
                    >
                </div>
                <div class="control-group range-slider-container">
                    <label>Out-of-Tune Range (cents)</label>
                    <input type="range" 
                           id="visRange" 
                           min="-1.3" 
                           max="2.7" 
                           step="0.1" 
                           value="0"
                    >
                    <div class="range-ticks"></div>
                    <div class="range-value">±1 cent</div>
                </div>
                <div class="control-group">
                    <button id="saveState">Save to URL</button>
                </div>
            </div>
        </div>

        <div class="controls advanced-controls">
            <div class="section-title">Advanced Controls</div>
            <div class="advanced-controls-container">
                <div class="control-group">
                    <label>Tuning System</label>
                    <select id="tuningSystem">
                        <option value="JI5">Just Intonation (5-limit)</option>
                        <option value="ET">Equal Temperament</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Tonic Frequency (Hz)</label>
                    <select id="tonicFreq" class="editable-select">
                        <option value="100" selected>100 Hz</option>
                        <option value="261.63">Middle C (261.63 Hz)</option>
                        <option value="440">A 440 (440 Hz)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <main>
        <section class="tuning-section">
            <div class="visualization">
                <div id="heatmap"></div>
            </div>
        </section>
    </main>

    <!-- Load scripts after DOM elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="tuning-calculations.js"></script>
    <script src="audio.js"></script>
    <script src="visualizations.js"></script>
    <script src="main.js"></script>
</body>
</html>
